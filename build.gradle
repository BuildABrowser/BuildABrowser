plugins {
	id 'ru.vyarus.animalsniffer' version '2.0.1' apply false
}

import org.gradle.nativeplatform.internal.DefaultTargetMachineFactory
import org.gradle.internal.os.OperatingSystem

subprojects {
	apply plugin: 'java'

	repositories {
		maven { url 'https://jitpack.io' }
		mavenCentral()
	}

	dependencies {
		implementation "org.slf4j:slf4j-api:1.7.36"

		testImplementation platform("org.junit:junit-bom:6.0.1")
		testImplementation "org.junit.jupiter:junit-jupiter"
		testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}

	def desktopModules = [
		':Browser', ':Painter:Skija', ':Painter:Java2D', ':DebuggerSwing',
		':CookiesSQLite']

	if (!desktopModules.contains(project.path)) {
		apply plugin: 'ru.vyarus.animalsniffer'

		java {
			sourceCompatibility = JavaVersion.VERSION_21
			targetCompatibility = JavaVersion.VERSION_21
		}

		dependencies {
			signature 'com.toasttab.android:gummy-bears-api-29:0.14.0:@signature'
			// 29 signature does not have a coreLib2 variant, so use 24
			signature 'com.toasttab.android:gummy-bears-api-24:0.14.0:coreLib2@signature'
		}

		animalsniffer {
			sourceSets = [sourceSets.main]
			ignore = [
				'java.lang.Record',
				'java.lang.runtime',
				'java.util.zip.CRC32'
			]
		}
	} else {
		java {
			sourceCompatibility = JavaVersion.VERSION_24
			targetCompatibility = JavaVersion.VERSION_24
		}
	}

	def lwjglModules = [
		':Painter:Skija', ':TextShaping:HarfBuzz']

	if (lwjglModules.contains(project.path)) {
		dependencies {
			project.ext.lwjglVersion = "3.4.1"
			project.ext.lwjgl3_awtVersion = "0.2.4"

			project.ext.skijaVersion = "0.143.6"
			switch (OperatingSystem.current()) {
					case OperatingSystem.LINUX:
					project.ext.lwjglNatives = "natives-linux"
							project.ext.skijaNatives = "skija-linux-x64"
							break
					case OperatingSystem.WINDOWS:
					project.ext.lwjglNatives = "natives-windows"
							project.ext.skijaNatives = "skija-windows-x64"
							break
					case OperatingSystem.MAC_OS:
					project.ext.lwjglNatives = "natives-macos-arm64"
							project.ext.skijaNatives = "skija-macos-arm64"
							break
			}

			implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
		}
	}
}